services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    AA\PerformanceAnalyzer\:
        resource: '../*'
        exclude: '../{Entity,Model,Tests}'

    AA\PerformanceAnalyzer\Service\PerformanceTracker:
        arguments:
            $config: '%symfony_performance_analyzer.config%'
            $enabled: '%symfony_performance_analyzer.enabled%'

    AA\PerformanceAnalyzer\Service\Collector\DatabaseQueryCollector:
        tags: ['performance.collector']

    AA\PerformanceAnalyzer\Service\Collector\PerformanceDataCollector:
        tags: ['data_collector']

    AA\PerformanceAnalyzer\Service\Storage\DatabaseStorage:
        arguments:
            $config: '%symfony_performance_analyzer.config%'

    AA\PerformanceAnalyzer\Service\Storage\FileStorage:
        arguments:
            $config: '%symfony_performance_analyzer.config%'

    AA\PerformanceAnalyzer\Twig\PerformanceExtension:
        tags: ['twig.extension']

    AA\PerformanceAnalyzer\Utils\Timer: ~

    AA\PerformanceAnalyzer\Utils\QueryAnalyzer: ~

    AA\PerformanceAnalyzer\Utils\ComplexityCalculator: ~

    AA\PerformanceAnalyzer\EventSubscriber\PerformanceDataEventListener:
        tags:
            - { name: kernel.event_listener, event: AA\PerformanceAnalyzer\Event\PerformanceDataEvent, method: onPerformanceData }

    AA\PerformanceAnalyzer\Service\CircuitBreaker:
        arguments:
            $config: '%symfony_performance_analyzer.circuit_breaker%'

    AA\PerformanceAnalyzer\Service\Storage\StorageFactory:
        arguments:
            $config: '%symfony_performance_analyzer.config%'

    AA\PerformanceAnalyzer\Service\Storage\StorageInterface:
        factory: ['@AA\PerformanceAnalyzer\Service\Storage\StorageFactory', 'getStorage']

# Register Doctrine repositories as services
    AA\PerformanceAnalyzer\Repository\PerformanceLogRepository:
        factory: ['@doctrine.orm.default_entity_manager', 'getRepository']
        arguments:
            - AA\PerformanceAnalyzer\Entity\PerformanceLog

    AA\PerformanceAnalyzer\Repository\PerformanceStatRepository:
        factory: ['@doctrine.orm.default_entity_manager', 'getRepository']
        arguments:
            - AA\PerformanceAnalyzer\Entity\PerformanceStat